# Tant que ce fichier ne contient aucune entrée, la section ne s'affiche pas
# sur le site. Retire le # devant les lignes ci-dessous pour commencer.
# ===========================================================================

- titre: "Synthèse d'une méthode de recherche appliquée à l'étude de la participation électorale des Autochtones"
  fichier: "travaux_universitaires/beaudry_w_synthese_outil.pdf"
  date: "2024-10"
  categorie: "Travail de session"
  description: |
     Dans le cadre de l'École interdisciplinaire d'outils et de méthodes, j'ai proposé une application de la méthode de la double différence pour estimer l'effet de la présence des candidats et candidates autochtones sur la participation électorale dans les communautés autochtones aux élections de 2022.
     C'est dans ce travail que prend ses racines l'analyses de la participation selon la présence d'au moins un candidat ou une candidate autochtone qui figure à la page 6 de la note de recherche que j'ai produite chez Élections Québec.
     
- titre: "Revue de littérature de la (non)-participation électorale"
  fichier: "travaux_universitaires/beaudry_w_revue_lit_cvm.pdf"
  date: "2024-12"
  categorie: "Travail de session"
  description: |
     Pour le séminaire de maîtrise sur la participation québécoise et canadienne (POL-7075), j'ai organisé une revue de littérature sur la participation électorale des Autochtones selon le modèle du volontariat civique de Verba, Schlozman et Brady (1995).
     Cette revue de la littérature a jeté les bases de ma recension des écrits pour la Chaire de recheche ainsi que pour mon propre mémoire sur la participation politique des Autochtones.
     
- titre: "Similitudes et différences des révolutions américaines et françaises : conséquences sur les trajectoires politiques des deux régimes"
  fichier: "travaux_universitaires/beaudry_w_revolutions_usa_fr.pdf"
  date: "2022-04"
  categorie: "Travail de session"
  description: |
     Dans le cours du célèbre Jean-Pierre Derriennic, connu par nombre d'étudiant de l'Université Laval, j'ai produit une analyse historique des révolutions américaine et française du 18 siècles.
     J'ai relevé le contexte géographique des foyers de chaque révolution comme point de rupture expliquant la mise en place d'un système de contrepoids rigide aux États-Unis et d'un régime fortement centralisé en France.
     
- titre: "Concensus au parlement : cohésion historique, dissension anecdotique"
  fichier: "travaux_universitaires/beaudry_w_martin_l_ligne_parti.pdf"
  date: "2025-04"
  categorie: "Travail de session"
  description: |
     Pour le cours de politique comparée, ma collègues Laurianne Martin -- maintenant stagiaire du programme Jean-Charles Bonenfant -- et moi avons produit une analyse de la disension partisane dans les institutions parlementaires.
     Nous prédisons la dissension à partir des théories de l'identité sociale et de la théorie de l'incitation.

- titre: "Idle No More : du mouvement jusque dans l'urne ?"
  fichier: "travaux_universitaires/beaudry_w_idle-no-more.pdf"
  date: "2024-06"
  categorie: "Travail de session"
  description: |
     À partir des données de votes dans les communautés autochtones aux élections fédérales canadiennes de 2015, 2019 et 2021, je me suis intéressé à l'influence du mouvement sur la socialisation politique des électeurs de 18 à 44 ans.
     Il était question d'observer la présence ou non d'un événement politique assez important pour qu'une nouvelle cohorte d'électeurs autochtones avaient un comportement électoral sensiblement distincts de leurs pairs plus âgés et plus jeunes.

- titre: "Mémoire de commission parlementaire sur la participation électorale des jeunes"
  fichier: "travaux_universitaires/beaudry_w_desrosiers_j_part_jeune_reform.pdf"
  date: "2022-04"
  categorie: "Travail de session"
  description: |
     Cet exercice de rédaction de mémoire pour une commission parlementaire a porté sur la participation électorale des jeunes de 18-34 ans.
     Il se compose de deux parties : une première qui analyse la portée de l'enjeu de la participation électorale des jeunes -- rédigée par mon excellente collègue Jeanne Desrosiers -- et la deuxième partie qui apporte le changement du mode de scrutin comme une solution à l'enjeu.

- titre: "Éducation et élection: une combinaison gagnante ?"
  fichier: "travaux_universitaires/beaudry_w_badie_ce_educ_elec.pdf"
  date: "2022-12"
  categorie: "Travail de session"
  description: |
     Dans le cadre du cours Participation électorale au Québec et au Canada, toute la classe à procéder à une collecte de données via un sondage en ligne.
     Les résultats présentés dans le travail (en annexe) est le fruit de cet effort qui a rassemblés plus de 800 répondants.

- titre: "Analyse politique de la Loi électorale du Québec."
  fichier: "travaux_universitaires/beaudry_amoah_brassard_carignan_analyse_loi_elec.pdf"
  date: "2022-11"
  categorie: "Travail de session"
  description: |
     Ce travail d'analyse de politiques publiques porte sur la loi électorale à travers son processus d'élaboration.
     Ce travail d'équipe a été réalisé avec ma très talentueuse collègue de classe Alex Brassard et les très talentueux Benjamin Carignan et Chris A. Amoah.