# ===========================================================================
# documents.yml — Travaux universitaires consultables depuis le site
#
# Cette section accueille les documents que tu as produits pendant tes études
# et que tu veux montrer à un recruteur : travaux de session, rapports,
# notes de recherche, présentations.
#
# POUR AJOUTER UN DOCUMENT :
#   1. Dépose le PDF dans le dossier documents/
#   2. Copie-colle le bloc ci-dessous et remplis-le
#   3. source("build.R")
#
# Champs : titre (obligatoire), fichier (obligatoire), date (AAAA-MM),
#          categorie, description, apercu (image), epingle (true = en tête),
#          libelle (texte du bouton), bouton ("small" par défaut, "primary" = coloré)
