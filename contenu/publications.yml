# ===========================================================================
# publications.yml — Publications, rapports et communications
#
# Champs : titre (obligatoire), type, auteurs, editeur, numero,
#          lieu, date (AAAA ou AAAA-MM),
#          url (lien externe) OU fichier (PDF local), resume,
#          documents (liste de boutons, voir ci-dessous)
#
# documents : une liste de boutons sous l'entrée. Un bloc par document.
#     documents:
#       - fichier: "documents/diaporama.pdf"
#         libelle: "Consulter le diaporama"      # facultatif
#       - fichier: "documents/affiche.pdf"
#         libelle: "Voir l'affiche"
#         style: "primary"                        # facultatif : bouton coloré
#   Sans libelle, le texte est déduit de l'extension (« Consulter le PDF »,
#   « Télécharger la présentation »...). Un lien externe s'écrit lien: au
#   lieu de fichier:.
#
# lieu accepte une chaîne ou une liste sur une seule ligne :
#     lieu: "Université Laval, Québec"
#     lieu: ["Université Laval", "Québec"]
# Les éléments d'une liste sont assemblés avec des virgules.
# ===========================================================================

- titre: "La participation politique des personnes autochtones au Québec, au Canada et dans le monde: une revue de la littérature scientifique"
  type: ""
  auteurs: "Beaudry, W."
  editeur: "Chaire de recherche sur la démocratie et les institutions parlementaires, en collaboration avec Élections Québec"
  lieu: ["Université Laval", "Québec"]
  date: "2026-03"
  numero: "no 25"
  url: ""
  documents:
    - fichier: "presentations/beaudry_w_crdip_r_lit.pdf"
      libelle: "Consulter le cahier"
      style: "Primary"
  resume: |
    La recension fait état du niveau de participation dans plusieurs modes de participation politique des Autochtones dans quelques contextes nationaux, notamment le Canada, les États-Unis, la Nouvelle-Zélande et l'Australie.

- titre: "Participation électorale dans les communautés autochtones lors d'élections générales provinciales de 2007 à 2022"
  type: ""
  auteurs: "Beaudry, W."
  editeur: "Élections Québec"
  date: "2026-05"
  url: ""
  documents:
    - fichier: "presentations/beaudry_w_eq_note.pdf"
      libelle: "Consulter la note"
      style: "Primary"
  resume: |
    La note brosse un portrait de la participation électorale dans les communautés autochtones au Québec. Plusieurs constats relatifs à la distance des communautés, la présence de candidates et candidats autochtones, ainsi que de données sociodémographiques mettent en contexte le vote dans ces communautés.

