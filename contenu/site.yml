# ---------------------------------------------------------------------------
# SECTIONS DE LA PAGE
# L'ordre ci-dessous = l'ordre à l'écran ET dans le menu de navigation.
# Pour masquer une section sans la supprimer : afficher: false
#
# Types disponibles :
#   texte         -> texte libre (+ image de bannière optionnelle)
#   texte_icones  -> texte libre + liste à pictogrammes
#   parcours      -> ligne du temps, lit contenu/parcours.yml
#   documents     -> liste de PDF, lit contenu/documents.yml
#   publications  -> liste de publications, lit contenu/publications.yml
#   projets       -> vignettes de projets, lit contenu/projets.yml
#   contact       -> bouton d'envoi de courriel
#
# Mise en forme du texte : **gras**, *italique*, [libellé](adresse),
# une ligne vide = un nouveau paragraphe.
# ---------------------------------------------------------------------------
sections:

  - id: "presentation"
    titre: "Qui je suis"
    type: "texte"
    banniere: "images/bg.jpg"
    entete: "William Beaudry"
    sous_titre: "Politologue à mes heures, apprenti chercheur et bien plus"
    texte: |
      Voici comment un sondage me décrirait : 1999, H, Québec, Baccalauréat, Étudiant, Francophone, Sans emploi.
      
      Pour en apprendre plus sur mon parcours professionnel et académique ainsi que les projets et publications sur lesquels j'ai travaillés, vous trouverez le tout sur cette page !

  - id: "En bref"
    titre: "En bref"
    type: "texte_icones"
    texte: |
      Je mène à terme une maîtrise en science politique avec mémoire à l'Université Laval cet automne. Mes thèmes de recherche recoupent la participation politique, les populations autochtones et l'analyse quantitative de données de sondages.
      
      Je participe moi-même à la vie politique québécoise au-delà de quelques contributions scientifiques: je me présente comme candidat du parti Nul dans la circonscription de Chauveau.
      
    faits:
      - icone: "solid fa-graduation-cap"
        texte: "Candidat à la maîtrise en science politique"
      - icone: "solid fa-university"
        texte: "Candidat du parti Nul"
      - icone: "solid fa-file-alt"
        texte: "2 publications institutionnelles"
      - icone: "solid fa-arrow-right"
        texte: "100 km de marche pour le cancer"
      - icone: "solid fa-search"
        texte: "À la recherche d'un emploi"
      

  - id: "parcours"
    titre: "Mon parcours"
    type: "parcours"
    texte: |
      Un parcour marqué par la recherche, la vulgarisation de phénomènes complexes et le travail d'équipe.

  - id: "documents"
    titre: "Mes documents"
    type: "documents"
    texte: |
      Mon curriculum vitæ et mes autres documents, consultables directement en ligne.

  - id: "publications"
    titre: "Publications et communications"
    type: "publications"
    texte: |

  - id: "projets"
    titre: "Mes projets"
    type: "projets"
    texte: |
      Une sélection de mes projets. Cliquez sur l'image pour découvrir le projet complet.

  - id: "contact"
    titre: "Me joindre"
    type: "contact"
    texte: |
      Pour entrer en contact, n'hésitez pas à m'envoyer un courriel ou à visiter mes médias sociaux. Il me fera plaisir de répondre dans les plus brefs délais.
